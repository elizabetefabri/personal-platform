<section class="studyPage">
  <header class="studyPage__header">
    <div class="studyPage__topRow">
      <app-back-button></app-back-button>
      <ng-content select="[slot='header-actions']"></ng-content>
    </div>
    <div class="studyPage__headerBottom">
      <h1 class="studyPage__title">{{ pageTitle }}</h1>
      <p class="studyPage__description">{{ pageDescription }}</p>
    </div>
  </header>

  <div class="studyGrid" aria-label="Lista de estudos">
    @for (item of items; track item.id) {
      <article
        class="studyCard"
        [style.--card-accent]="getAccentColor(item)"
      >
        <div
          class="studyCard__imageWrapper"
          [style.background]="item.bannerColor || 'var(--color-border-subtle)'"
        >
          @if (item.imageUrl) {
            <img
              class="studyCard__image"
              [src]="item.imageUrl"
              [alt]="item.title"
              (error)="onImageError($event)"
            />
          }

          <span class="studyCard__icon">
            <i class="pi" [ngClass]="item.iconClass" aria-hidden="true"></i>
          </span>

          @if (item.apiId) {
            <button
              class="studyCard__deleteBtn"
              type="button"
              pTooltip="Excluir item"
              tooltipPosition="top"
              (click)="requestDelete(item, $event)"
              aria-label="Excluir {{ item.title }}"
            >
              <i class="pi pi-trash"></i>
            </button>
          }
        </div>

        <div class="studyCard__content">
          <h2 class="studyCard__title">{{ item.title }}</h2>

          <p class="studyCard__description">
            {{ item.description }}
          </p>

          <span class="studyCard__skill">{{ item.skill }}</span>

          <a
            pButton
            [routerLink]="item.detailRoute"
            [label]="item.buttonLabel ?? 'Abrir Trilha'"
            iconPos="right"
            class="studyCard__button"
          ></a>
        </div>
      </article>
    }
  </div>
</section>
