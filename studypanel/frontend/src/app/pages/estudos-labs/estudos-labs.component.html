<div class="page-container">
  <app-study-card-grid
    [pageTitle]="pageTitle"
    [pageDescription]="pageDescription"
    [items]="items()"
    (deleteRequest)="onDeleteRequest($event)"
    (editRequest)="onEditRequest($event)"
  >
    <div class="estudos__actions" slot="header-actions">
      <p-button
        label="Cadastrar nova área de estudo"
        icon="pi pi-plus"
        [outlined]="true"
        styleClass="btn-accent-outline"
        pTooltip="Cadastrar Nova área de estudo"
        tooltipPosition="bottom"
        (onClick)="openCreateModal()"
      />
    </div>
  </app-study-card-grid>
</div>

<!-- Modal: Cadastrar / Editar -->
<p-dialog
  [(visible)]="modalVisible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '520px' }"
  [header]="editingSection ? 'Editar Área de Estudo' : 'Cadastrar Nova Área de Estudo'"
  styleClass="studyModal"
  (onHide)="cancelModal()"
>
  <form class="form" (ngSubmit)="saveSection()">
    @if (errorMessage) {
      <div class="form__error">{{ errorMessage }}</div>
    }
    <label class="field">
      <span>Nome *</span>
      <input pInputText id="sec-name" name="name" [(ngModel)]="form.name" placeholder="Ex: Backend" />
    </label>
    <label class="field">
      <span>Slug *</span>
      <input pInputText id="sec-slug" name="slug" [(ngModel)]="form.slug" placeholder="Ex: backend" [disabled]="!!editingSection" />
    </label>
    <label class="field">
      <span>Descrição</span>
      <input pInputText id="sec-desc" name="description" [(ngModel)]="form.description" placeholder="Descrição curta da seção" />
    </label>
    <div class="form__row">
      <label class="field">
        <span>Cor do card</span>
        <input pInputText id="sec-color" name="bannerColor" [(ngModel)]="form.bannerColor" placeholder="linear-gradient(...)" />
      </label>
      <label class="field">
        <span>Ícone (PrimeIcons)</span>
        <input pInputText id="sec-icon" name="iconClass" [(ngModel)]="form.iconClass" placeholder="pi-book" />
      </label>
    </div>
    <label class="field">
      <span>URL da imagem</span>
      <input pInputText id="sec-image" name="imageUrl" [(ngModel)]="form.imageUrl" placeholder="/assets/images/..." />
    </label>
    <label class="field">
      <span>Ordem</span>
      <input pInputText id="sec-order" type="number" name="order" [(ngModel)]="form.order" />
    </label>
    <footer class="formActions">
      <button pButton type="button" label="Cancelar" class="btn-cancel" (click)="cancelModal()"></button>
      <button pButton type="submit" [label]="editingSection ? 'Salvar alterações' : 'Salvar área'" icon="pi pi-check" [disabled]="saving()" class="btn-primary"></button>
    </footer>
  </form>
</p-dialog>

<!-- Modal: Confirmar exclusão -->
<p-dialog
  [(visible)]="deleteModalVisible"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '440px' }"
  header="Confirmar exclusão"
  styleClass="studyModal"
>
  <div class="delete-confirm">
    <i class="pi pi-exclamation-triangle delete-confirm__icon"></i>
    <p class="delete-confirm__text">
      Tem certeza que deseja excluir <strong>{{ deleteTargetName }}</strong>?
      <br /><span class="delete-confirm__hint">Esta ação não pode ser desfeita.</span>
    </p>
  </div>
  <footer class="formActions">
    <button pButton type="button" label="Cancelar" class="btn-cancel" (click)="cancelDelete()"></button>
    <button pButton type="button" label="Confirmar exclusão" icon="pi pi-trash" severity="danger" (click)="confirmDelete()"></button>
  </footer>
</p-dialog>
