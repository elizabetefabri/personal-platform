<div class="page-container">
  <app-study-card-grid
    [pageTitle]="pageTitle"
    [pageDescription]="pageDescription"
    [items]="items()"
    (deleteRequest)="onDeleteRequest($event)"
    (editRequest)="onEditRequest($event)"
  >
    <div class="estudos__actions" slot="header-actions">
      <p-button
        label="Cadastrar Tipo de Curso"
        icon="pi pi-plus"
        [outlined]="true"
        styleClass="btn-accent-outline"
        pTooltip="Cadastrar novo tipo de curso"
        tooltipPosition="bottom"
        (onClick)="openCreateModal()"
      />
    </div>
  </app-study-card-grid>
</div>

<!-- Modal: Cadastrar / Editar -->
<p-dialog
  [(visible)]="modalVisible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '520px' }"
  [header]="editingSection ? 'Editar Tipo de Curso' : 'Cadastrar Novo Curso'"
  (onHide)="cancelModal()"
>
  <div class="modal-form">
    @if (errorMessage) {
      <div class="modal-form__error">{{ errorMessage }}</div>
    }
    <div class="modal-form__field">
      <label for="sec-name">Nome *</label>
      <input pInputText id="sec-name" [(ngModel)]="form.name" placeholder="Ex: Backend" />
    </div>
    <div class="modal-form__field">
      <label for="sec-slug">Slug *</label>
      <input pInputText id="sec-slug" [(ngModel)]="form.slug" placeholder="Ex: backend" [disabled]="!!editingSection" />
    </div>
    <div class="modal-form__field">
      <label for="sec-desc">Descrição</label>
      <input pInputText id="sec-desc" [(ngModel)]="form.description" placeholder="Descrição curta da seção" />
    </div>
    <div class="modal-form__field">
      <label for="sec-color">Cor do card</label>
      <input pInputText id="sec-color" [(ngModel)]="form.bannerColor" placeholder="linear-gradient(...)" />
    </div>
    <div class="modal-form__field">
      <label for="sec-icon">Ícone (PrimeIcons)</label>
      <input pInputText id="sec-icon" [(ngModel)]="form.iconClass" placeholder="pi-book" />
    </div>
    <div class="modal-form__field">
      <label for="sec-image">URL da imagem</label>
      <input pInputText id="sec-image" [(ngModel)]="form.imageUrl" placeholder="/assets/images/..." />
    </div>
    <div class="modal-form__field">
      <label for="sec-order">Ordem</label>
      <input pInputText id="sec-order" type="number" [(ngModel)]="form.order" />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" severity="contrast" [outlined]="true" (onClick)="cancelModal()"></button>

    <button pButton [label]="editingSection ? 'Salvar alterações' : 'Cadastrar'" [loading]="saving()" severity="contrast" (onClick)="saveSection()" ></button>
  </ng-template>
</p-dialog>

<!-- Modal: Confirmar exclusão -->
<p-dialog
  [(visible)]="deleteModalVisible"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '440px' }"
  header="Confirmar exclusão"
>
  <div class="delete-confirm">
    <i class="pi pi-exclamation-triangle delete-confirm__icon"></i>
    <p class="delete-confirm__text">
      Tem certeza que deseja excluir <strong>{{ deleteTargetName }}</strong>?
      <br /><span class="delete-confirm__hint">Esta ação não pode ser desfeita.</span>
    </p>
  </div>
  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancelDelete()" ></button>
    <button pButton label="Confirmar exclusão" icon="pi pi-trash" severity="danger" (onClick)="confirmDelete()" ></button>
  </ng-template>
</p-dialog>
