<div class="page-container">
  <app-study-card-grid
    [pageTitle]="pageTitle"
    [pageDescription]="pageDescription"
    [items]="items()"
    (deleteRequest)="onDeleteRequest($event)"
  >
    <div slot="header-actions" class="section-page__actions">
      <p-button
        label="Cadastrar Item da Trilha"
        icon="pi pi-plus"
        [outlined]="true"
        styleClass="btn-accent-outline"
        pTooltip="Cadastrar novo item nesta trilha"
        tooltipPosition="bottom"
        (onClick)="openCreateModal()"
      />
    </div>
  </app-study-card-grid>
</div>

<!-- Modal: Cadastrar / Editar -->
<p-dialog
  [(visible)]="modalVisible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '520px' }"
  [header]="editingTopic ? 'Editar Item da Trilha' : 'Cadastrar Item da Trilha'"
  (onHide)="cancelModal()"
>
  <div class="modal-form">
    @if (errorMessage) {
      <div class="modal-form__error">{{ errorMessage }}</div>
    }
    <div class="modal-form__field">
      <label for="topic-label">Nome *</label>
      <input pInputText id="topic-label" [(ngModel)]="form.label" placeholder="Ex: Node.js" />
    </div>
    <div class="modal-form__field">
      <label for="topic-slug">Slug *</label>
      <input pInputText id="topic-slug" [(ngModel)]="form.slug" placeholder="Ex: nodejs" [disabled]="!!editingTopic" />
    </div>
    <div class="modal-form__field">
      <label for="topic-desc">Descrição</label>
      <input pInputText id="topic-desc" [(ngModel)]="form.description" placeholder="Descrição curta do tópico" />
    </div>
    <div class="modal-form__field">
      <label for="topic-skill">Tag / Skill</label>
      <input pInputText id="topic-skill" [(ngModel)]="form.skill" placeholder="Ex: Runtime" />
    </div>
    <div class="modal-form__field">
      <label for="topic-color">Cor do card</label>
      <input pInputText id="topic-color" [(ngModel)]="form.bannerColor" placeholder="linear-gradient(...)" />
    </div>
    <div class="modal-form__field">
      <label for="topic-icon">Ícone (PrimeIcons)</label>
      <input pInputText id="topic-icon" [(ngModel)]="form.iconClass" placeholder="pi-code" />
    </div>
    <div class="modal-form__field">
      <label for="topic-image">URL da imagem</label>
      <input pInputText id="topic-image" [(ngModel)]="form.imageUrl" placeholder="/assets/images/..." />
    </div>
    <div class="modal-form__field">
      <label for="topic-order">Ordem</label>
      <input pInputText id="topic-order" type="number" [(ngModel)]="form.order" />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancelModal()" />
    <p-button [label]="editingTopic ? 'Salvar alterações' : 'Cadastrar'" icon="pi pi-check" [loading]="saving()" (onClick)="saveTopic()" />
  </ng-template>
</p-dialog>

<!-- Modal: Confirmar exclusão -->
<p-dialog
  [(visible)]="deleteModalVisible"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '440px' }"
  header="Confirmar exclusão"
>
  <div class="delete-confirm">
    <i class="pi pi-exclamation-triangle delete-confirm__icon"></i>
    <p class="delete-confirm__text">
      Tem certeza que deseja excluir <strong>{{ deleteTargetName }}</strong>?
      <br /><span class="delete-confirm__hint">Esta ação não pode ser desfeita.</span>
    </p>
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="cancelDelete()" />
    <p-button label="Confirmar exclusão" icon="pi pi-trash" severity="danger" (onClick)="confirmDelete()" />
  </ng-template>
</p-dialog>
