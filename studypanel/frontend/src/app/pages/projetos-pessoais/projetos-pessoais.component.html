<div class="page-container">
  <app-project-card-grid
    [pageTitle]="pageTitle"
    [pageDescription]="pageDescription"
    [items]="items()"
    (deleteRequest)="onDeleteRequest($event)"
    (editRequest)="onEditRequest($event)"
  >
    <div slot="header-actions" class="projects__actions">
      <p-button
        label="Cadastrar Projeto Pessoal"
        icon="pi pi-plus"
        styleClass="btn-accent-outline"
        pTooltip="Cadastrar novo projeto pessoal"
        tooltipPosition="bottom"
        (onClick)="openCreateModal()"
      />
    </div>
  </app-project-card-grid>
</div>

<!-- Modal: Cadastrar / Editar -->
<p-dialog
  [(visible)]="modalVisible"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '540px' }"
  [header]="editingProject ? 'Editar Projeto Pessoal' : 'Cadastrar Projeto Pessoal'"
  styleClass="studyModal"
  (onHide)="cancelModal()"
>
  <form class="form" (ngSubmit)="saveProject()">
    @if (errorMessage) {
      <div class="form__error">{{ errorMessage }}</div>
    }
    <label class="field">
      <span>Nome *</span>
      <input pInputText name="name" [(ngModel)]="form.name" placeholder="Ex: Comanda Flow" />
    </label>
    <label class="field">
      <span>Slug</span>
      <input pInputText name="slug" [(ngModel)]="form.slug" placeholder="Ex: comanda-flow" />
    </label>
    <label class="field">
      <span>Descrição</span>
      <input pInputText name="description" [(ngModel)]="form.description" placeholder="Descrição curta do projeto" />
    </label>
    <label class="field">
      <span>Tags (separadas por vírgula)</span>
      <input pInputText name="tagsInput" [(ngModel)]="tagsInput" placeholder="Angular, TypeScript, ..." />
    </label>
    <div class="form__row">
      <label class="field">
        <span>URL do Repositório</span>
        <input pInputText name="repoUrl" [(ngModel)]="form.repoUrl" placeholder="https://github.com/..." />
      </label>
      <label class="field">
        <span>URL do Deploy</span>
        <input pInputText name="deployUrl" [(ngModel)]="form.deployUrl" placeholder="https://..." />
      </label>
    </div>
    <div class="form__row">
      <label class="field">
        <span>Cor do card</span>
        <input pInputText name="bannerColor" [(ngModel)]="form.bannerColor" placeholder="linear-gradient(...)" />
      </label>
      <label class="field">
        <span>URL da imagem</span>
        <input pInputText name="imageUrl" [(ngModel)]="form.imageUrl" placeholder="/assets/images/..." />
      </label>
    </div>
    <footer class="formActions">
      <button pButton type="button" label="Cancelar" class="btn-cancel" (click)="cancelModal()"></button>
      <button pButton type="submit" [label]="editingProject ? 'Salvar alterações' : 'Cadastrar'" icon="pi pi-check" [disabled]="saving()" class="btn-primary"></button>
    </footer>
  </form>
</p-dialog>

<!-- Modal: Confirmar exclusão -->
<p-dialog
  [(visible)]="deleteModalVisible"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '440px' }"
  header="Confirmar exclusão"
  styleClass="studyModal"
>
  <div class="delete-confirm">
    <i class="pi pi-exclamation-triangle delete-confirm__icon"></i>
    <p class="delete-confirm__text">
      Tem certeza que deseja excluir <strong>{{ deleteTargetName }}</strong>?
      <br /><span class="delete-confirm__hint">Esta ação não pode ser desfeita.</span>
    </p>
  </div>
  <footer class="formActions">
    <button pButton type="button" label="Cancelar" class="btn-cancel" (click)="cancelDelete()"></button>
    <button pButton type="button" label="Confirmar exclusão" icon="pi pi-trash" severity="danger" (click)="confirmDelete()"></button>
  </footer>
</p-dialog>
